name: CI

# LLM_ENABLED=false is not incidental here — CLAUDE.md invariant 9 says the demo must survive an
# LLM outage, and ADR-003 requires that "LLM_ENABLED=false must run the full pipeline on templates
# alone". CI is where that claim stops being a claim. No provider API key is ever configured for
# this workflow, so a test that reached a real model would fail rather than quietly cost money.

on:
  push:
    branches: [main]
  pull_request:

env:
  LLM_ENABLED: "false"
  DATABASE_URL: postgresql+psycopg://payvra:payvra@localhost:5432/payvra
  PUBLIC_BASE_URL: https://payvra.test

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: payvra
          POSTGRES_PASSWORD: payvra
          POSTGRES_DB: payvra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U payvra -d payvra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Migrate
        run: alembic -c api/alembic.ini upgrade head

      - name: Lint
        run: ruff check api

      - name: Typecheck
        run: mypy -p app

      - name: Test
        run: pytest -q
        working-directory: api

  # The generation layer takes a plain context and never touches a session, so the whole template
  # path is provable with no database and no litellm installed. Running it that way is the point:
  # if this job passes, the fallback genuinely has no hidden dependency on the thing it is a
  # fallback for.
  templates-standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install without litellm
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip uninstall -y litellm

      - name: Generation tests on templates alone
        run: pytest -q tests/test_generation.py
        working-directory: api
        env:
          LLM_ENABLED: "false"
