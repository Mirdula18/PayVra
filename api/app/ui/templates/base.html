<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} · PAYVRA</title>
<style>
  :root {
    --ink: #16232b; --muted: #5a6b73; --line: #d9e1e1; --line-soft: #eef2f2;
    --paper: #f5f7f7; --surface: #fff;
    --ok: #0f6b62; --ok-bg: #e2efec;
    --stop: #a33b23; --stop-bg: #f7e7e2;
    --warn: #b26a00; --warn-bg: #f8eedd;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, system-ui, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  header { background: var(--surface); border-bottom: 1px solid var(--line); }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }
  .bar { display: flex; align-items: baseline; gap: 22px; padding: 16px 0; flex-wrap: wrap; }
  .brand { font-weight: 700; letter-spacing: .02em; font-size: 17px; }
  .brand span { color: var(--ok); }
  nav a { color: var(--muted); text-decoration: none; font-weight: 500; padding: 4px 0; }
  nav a.on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--ok); }
  nav a:hover { color: var(--ink); }
  .who { margin-left: auto; color: var(--muted); font-size: 13px; }
  main { padding: 26px 0 60px; }
  h1 { font-size: 23px; margin: 0 0 4px; letter-spacing: -.01em; }
  .lede { color: var(--muted); margin: 0 0 22px; max-width: 74ch; }
  table { border-collapse: collapse; width: 100%; background: var(--surface); }
  .scroll { overflow-x: auto; border: 1px solid var(--line); }
  th {
    text-align: left; font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  td { padding: 11px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  .pill {
    display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; padding: 2px 8px; border-radius: 3px; white-space: nowrap;
  }
  .pill-ok { background: var(--ok-bg); color: var(--ok); }
  .pill-stop { background: var(--stop-bg); color: var(--stop); }
  .pill-warn { background: var(--warn-bg); color: var(--warn); }
  .pill-mute { background: #e9eeee; color: var(--muted); }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0 0 16px; }
  .chip {
    border: 1px solid var(--line); background: var(--surface); color: var(--muted);
    padding: 5px 11px; border-radius: 999px; text-decoration: none; font-size: 13px;
  }
  .chip.on { border-color: var(--ok); color: var(--ok); font-weight: 600; }
  .empty { padding: 34px; text-align: center; color: var(--muted); background: var(--surface); border: 1px solid var(--line); }
  .note { border-left: 3px solid var(--ok); background: var(--ok-bg); padding: 13px 16px; margin: 18px 0; }
  .note.warn { border-left-color: var(--warn); background: var(--warn-bg); }
  select, input, button { font: inherit; padding: 6px 9px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--ink); }
  button { background: var(--ok); color: #fff; border-color: var(--ok); cursor: pointer; font-weight: 600; }
  a { color: var(--ok); }
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <div class="brand">PAYVRA<span>.</span></div>
    <nav>
      <a href="/ui/audit" class="{% if title == 'Audit log' %}on{% endif %}">Audit log</a>
      &nbsp;
      <a href="/ui/worklist" class="{% if title == 'Worklist' %}on{% endif %}">Worklist</a>
      &nbsp;
      <a href="/ui/recovery" class="{% if title == 'Recovery' %}on{% endif %}">Recovery</a>
    </nav>
    {% if merchant %}<div class="who">{{ merchant.name }}</div>{% endif %}
  </div>
</header>
<main class="wrap">
{% block body %}{% endblock %}
</main>
</body>
</html>
