# Alembic config for PAYVRA. The database URL is injected from app.config in env.py,
# so DATABASE_URL stays the single source of truth. script_location uses %(here)s so
# `alembic -c api/alembic.ini ...` works from any cwd.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
path_separator = os
# sqlalchemy.url is set programmatically in env.py.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
